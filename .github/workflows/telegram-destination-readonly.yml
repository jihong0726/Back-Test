name: Verify existing Telegram destination (read only)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: telegram-destination-readonly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Query bot and existing destination without sending messages
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,sys
          token=os.environ.get('TG_TOKEN','');chat=os.environ.get('TG_CHAT','')
          if not token or not chat:
              print('DIAGNOSTIC_FAILED: missing existing configuration');sys.exit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          def call(method,params):
              assert method in ('getMe','getChat')
              req=urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,
                  data=urllib.parse.urlencode(params).encode(),method='POST')
              try:
                  with opener.open(req,timeout=15) as response:
                      obj=json.load(response)
                  if obj.get('ok') is not True or not isinstance(obj.get('result'),dict):
                      raise ValueError()
                  return obj['result']
              except Exception:
                  print('DIAGNOSTIC_FAILED: '+method+' unavailable; details withheld');sys.exit(1)
          me=call('getMe',{});dest=call('getChat',{'chat_id':chat})
          def safe(value):
              return ''.join(c for c in str(value or '') if c.isprintable())[:100]
          result={'bot_username':safe(me.get('username')),'destination_type':safe(dest.get('type'))}
          if dest.get('type')=='private':
              result['destination_display_name']=safe(' '.join(str(dest.get(k) or '') for k in ('first_name','last_name')).strip())
              result['destination_username']=safe(dest.get('username'))
          else:
              result['destination_title']=safe(dest.get('title'))
          print('READ_ONLY_DESTINATION_CHECK '+json.dumps(result,ensure_ascii=True))
          print('NO_MESSAGE_SENT; NO_SECRET_OR_CHAT_ID_OUTPUT')
          PY
